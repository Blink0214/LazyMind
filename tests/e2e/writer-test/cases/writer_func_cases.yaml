    request:
      text: 请重写我上传的完整文章并调整结构，全文1500字左右，无需配图。
      attachment: {fixture: markdown_full}
    expected:
      route: rewrite
      steps: [prepare, write_document]
      workspaces:
        prepare: {structure_mode: sectioned, representation: markdown, next_step: write_document}
        write_document: {operation: rewrite, representation: markdown, next_step: __end__}
      tools:
        required: [writer_prepare_workspace, writer_draft_workspace]
        forbidden: [writer_outline_workspace]
      artifacts:
        required:
          source_document: {extension: .md}
          section_instructions: {}
        forbidden: [outline_document, document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content: {min_chars: 900, max_chars: 2800, source_similarity_max: 0.95}
    acceptance:
      review_mode: ai_after_execution
      criteria:
      - 按本次 expected 逐项核对 route、steps、workspaces、tools、artifacts、final 和 write_back 中实际配置的规则；不得以工作流 completed 或回执 success
        代替业务通过。
      - 最终稿在 LazyMind 可见、非空且无错误占位；ui_editable=true 时需编辑器可编辑状态证据，不能仅凭数据标记推断。new_revision=true 需本次创建或修订记录，不能仅凭 revision
        大于零判定。
      - 以本次规则快照、输入、源文档、最终产物、session、trace、SSE 和 UI 录屏/页面为证据；报告逐项记录观察、证据路径和 PASS / FAIL / INCONCLUSIVE，缺少证据不得推断通过。
      - 保留原文主题、主要事实与核心信息，实质重写正文并调整组织结构；仅替换少量词句不算完成，达到相似度阈值也不能替代该判断。
      - 本次请求无需配图：最终稿不新增配图；不得将配图缺失判为失败。配置 image_calls=0 时另核对本次图片生成调用确为零。
      measurement_notes:
        character_count: 沿用原内容校验口径：Markdown 去行首标题标记、列表前缀、HTML a 标签及 ` * _ > [ ] ( ) 标记；IR 取标题和递归块 content；随后去全部空白，按字符数比较
          min_chars/max_chars（含边界）。这是测试统计口径，不是中文词数；不得直接使用 raw_markdown characters 替代。
        similarity: 沿用原相似度口径：对源文档与成稿采用上述字符归一化，计算 Python difflib.SequenceMatcher(None, source, final).ratio()（默认 autojunk=True）；按
          source_similarity_min/max 含边界比较。AI 可临时调用计算工具取得数值，不得凭阅读估计；该数值仅为一项规则，不能替代改写质量或非目标内容保留检查。


