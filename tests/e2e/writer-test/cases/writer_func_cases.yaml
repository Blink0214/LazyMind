schema_version: 2
suite: ai-writer-core

fixtures:
  markdown_outline: {kind: local_file, path: fixtures/func/writer-outline.md}
  markdown_full: {kind: local_file, path: fixtures/func/writer-full.md}
  markdown_refs: {kind: local_file, path: fixtures/func/writer-refs.md}

# 飞书测试文档统一登记（URL + 基线版本），功能与性能各自独立记录。
# 基线以文档当前状态为准：跑前比较当前正文与 baseline_revision_id 内容，
# 不同则 history-revert 到 history_version_id。
feishu_docs:
  outline:            # 功能测试大纲（C03/I02）
    url: https://sensetime.feishu.cn/wiki/FgOfw3gh8ivcajk8FPyc086Knvg
    history_version_id: '32768'
    baseline_revision_id: 78
  full:               # 功能测试全文（C05/C07）
    url: https://sensetime.feishu.cn/wiki/G828wPWqDiokGvkqTNzcUPuDnec
    history_version_id: '31744'
    baseline_revision_id: 95

# 非飞书文档统一登记；reference 为 URL / URI，微信按草稿完整标题定位。
provider_docs:
  notion_file:
    provider: notion
    reference: "https://app.notion.com/p/3df7b0d754e080b7a5c8dc5a5f4fb186"
  github_file:
    provider: github
    reference: "https://github.com/Blink0214/LazyMind/blob/github-test/tests/e2e/fixtures/camping-guide.md"
  obsidian_file:
    provider: obsidian
    reference: "obsidian://open?vault=Obsidian%20Vault&file=%E9%9C%B2%E8%90%A5%E6%8C%87%E5%8D%97"
  wechat_title:
    provider: wechat
    reference: "周末露营活动指南"

scenarios:
  - id: C01
    title: 从零创建 Markdown 全文
    request:
      text: 写一篇面向社会公众的《台风天安全防范指南》公众号文章，全文1500字左右，无需配图。
      attachment: {kind: none}
    expected:
      route: create
      steps: [prepare, outline, write_document]
      workspaces:
        prepare: {structure_mode: sectioned, representation: markdown, next_step: outline}
        outline: {operation: generate, next_step: write_document}
        write_document: {operation: generate, representation: markdown, next_step: __end__}
      tools:
        # 新业务逻辑将各步骤封装为顶层 workspace 工具，内部子步骤不再单独出 trace。
        required: [writer_prepare_workspace, writer_outline_workspace, writer_draft_workspace]
        forbidden: []
      artifacts:
        required:
          outline_document: {extension: .md}
          section_instructions: {}
        forbidden: [source_document, document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content: {min_chars: 900, max_chars: 2800}
      sse: {required: true, min_deltas: 2, reconstruct_final: true}

  - id: C02
    title: 根据 Markdown 大纲扩写全文
    request:
      text: 请根据我上传的大纲扩写成一篇完整文章，全文1500字左右，无需配图。
      attachment: {fixture: markdown_outline}
    expected:
      route: expand
      steps: [prepare, outline, write_document]
      artifacts:
        required:
          source_document: {extension: .md}
          outline_document: {extension: .md}
          section_instructions: {}
        forbidden: [document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content: {min_chars: 900, max_chars: 2800, source_heading_coverage_min: 0.8}

  - id: C03
    title: 根据飞书 IR 大纲扩写全文
    request:
      text: 请根据这份飞书大纲扩写成一篇完整文章，全文1500字左右，正文中无需配图：${outline}
    feishu_doc: outline
    expected:
      route: expand
      steps: [prepare, outline, write_document]
      artifacts:
        required:
          source_document: {extension: .lmd, stage: outline, provider: feishu}
          target_document: {provider: feishu}
          outline_document: {extension: .lmd, stage: outline}
          section_instructions: {}
          document_write_result: {success: true}
        forbidden: []
      final: {extension: .lmd, representation: ir, stage: draft_or_final, provider: feishu, ui_editable: true, new_revision: true}
      write_back: {mode: replace, calls: 1, provider_revision_increases: true}
      content: {min_chars: 900, max_chars: 2800, source_heading_coverage_min: 0.8}
      provider_materialization: true

  - id: C04
    title: Markdown 全文重写
    request:
      text: 请重写我上传的完整文章并调整结构，全文1500字左右，无需配图。
      attachment: {fixture: markdown_full}
    expected:
      route: rewrite
      steps: [prepare, write_document]
      workspaces:
        prepare: {structure_mode: sectioned, representation: markdown, next_step: write_document}
        write_document: {operation: rewrite, representation: markdown, next_step: __end__}
      tools:
        required: [writer_prepare_workspace, writer_draft_workspace]
        forbidden: [writer_outline_workspace]
      artifacts:
        required:
          source_document: {extension: .md}
          section_instructions: {}
        forbidden: [outline_document, document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content: {min_chars: 900, max_chars: 2800, source_similarity_max: 0.95}

  - id: C05
    title: 飞书 IR 全文重写
    request:
      text: 请重写这篇飞书文章并调整结构，全文1500字左右，无需配图：${full} 
    feishu_doc: full
    expected:
      route: rewrite
      steps: [prepare, write_document]
      artifacts:
        required:
          source_document: {extension: .lmd, stage: draft_or_final, provider: feishu}
          target_document: {provider: feishu}
          section_instructions: {}
          document_write_result: {success: true}
        forbidden: [outline_document]
      final: {extension: .lmd, representation: ir, stage: draft_or_final, provider: feishu, ui_editable: true, new_revision: true}
      write_back: {mode: replace, calls: 1, provider_revision_increases: true}
      content: {min_chars: 900, max_chars: 2800, source_similarity_max: 0.95}
      provider_materialization: true

  - id: C06
    title: Markdown 组合局部修改
    request:
      text: >-
        请对我上传的完整文章执行以下修改，其他内容保持不变：1) 在“台风来临前的准备工作”这一章后面插入新的一章“应急物资准备”；
        2) 将“台风过后的注意事项”和“台风期间的安全措施”两个章节交换顺序。
      attachment: {fixture: markdown_full}
    expected:
      route: revise
      steps: [prepare, write_document]
      modify_types: [create, move]
      artifacts:
        required:
          source_document: {extension: .md}
          document_revision_task: {task_type: revise}
          document_modify_plan: {}
          document_revision_set: {schema: lazyllm.tools.writer.data_models.revision.StringReplaceSet}
          document_revision_result: {success: true}
        forbidden: [outline_document, section_instructions, document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content:
        required_headings: [应急物资准备]
        # 新提示词不再要求删除或改写，这些原文应保留。
        required_text:
          - 地下通道、地下车库及下沉式建筑
          - 台风过境后，天气的短暂好转往往容易让人误以为危险已经完全解除，实际上灾后环境中潜藏着诸多次生风险。这一阶段的核心原则是：在没有接到官方明确的风险解除通知前，仍须保持高度警惕，所有行动应以安全评估为前提。
        ordered_headings: [台风来临前的准备工作, 应急物资准备, 台风过后的注意事项, 台风期间的安全措施]
        source_similarity_min: 0.55

  - id: C07
    title: 飞书 IR 组合局部修改
    request:
      text: >-
        请对这篇飞书文章执行以下修改，其他内容保持不变：1) 在“台风来临前的准备工作”这一章后面插入新的一章“应急物资准备”；
        2) 将“台风过后的注意事项”和“台风期间的安全措施”两个章节交换顺序：${full}
    feishu_doc: full
    expected:
      route: revise
      steps: [prepare, write_document]
      modify_types: [create, move]
      artifacts:
        required:
          source_document: {extension: .lmd, stage: draft_or_final, provider: feishu}
          document_revision_task: {task_type: revise}
          document_modify_plan: {}
          document_revision_set: {schema: lazyllm.tools.writer.data_models.revision.PatchSet}
          document_revision_result: {success: true}
        forbidden: [outline_document, section_instructions]
      final: {extension: .lmd, representation: ir, stage: draft_or_final, provider: feishu, ui_editable: true, new_revision: true}
      write_back: {tool: writer_publish_revision, calls: 1, provider_revision_increases: true}
      content:
        required_headings: [应急物资准备]
        # 新提示词不再要求删除或改写，这些原文应保留。
        required_text:
          - 地下通道、地下车库及下沉式建筑
          - 台风过境后，天气的短暂好转往往容易让人误以为危险已经完全解除，实际上灾后环境中潜藏着诸多次生风险。这一阶段的核心原则是：在没有接到官方明确的风险解除通知前，仍须保持高度警惕，所有行动应以安全评估为前提。
        ordered_headings: [台风来临前的准备工作, 应急物资准备, 台风过后的注意事项, 台风期间的安全措施]
        source_similarity_min: 0.55
      provider_materialization: true

  - id: C08
    title: 从零创建 Markdown 分章节科幻小说
    request:
      text: 请启动 AI Writer，帮我写一篇科幻小说，讲述人类在一颗资源枯竭的流浪行星上发现远古文明遗迹、最终跨越种族隔阂重建家园的故事，包含序章、若干章节正文和尾声。 全文控制在 6000 字左右，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。
      attachment: {kind: none}
    expected:
      route: create
      steps: [prepare, outline, write_document]
      workspaces:
        prepare: {structure_mode: sectioned, representation: markdown, next_step: outline}
        outline: {operation: generate, next_step: write_document}
        write_document: {operation: generate, representation: markdown, next_step: __end__}
      tools:
        # 新业务逻辑将各步骤封装为顶层 workspace 工具，内部子步骤不再单独出 trace。
        required: [writer_prepare_workspace, writer_outline_workspace, writer_draft_workspace]
        forbidden: []
      artifacts:
        required:
          outline_document: {extension: .md}
          section_instructions: {}
          draft_blocks: {min_items: 1}
        forbidden: [source_document, document_write_result]
      final: {extension: .md, representation: markdown, new_revision: true}
      write_back: {calls: 0}
      content: {min_chars: 5100, max_chars: 7500}
      sse: {required: true, min_deltas: 2, reconstruct_final: true}

