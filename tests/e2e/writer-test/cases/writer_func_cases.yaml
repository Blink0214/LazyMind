  # 写作 3.0（9月）新增用例，来源文档 revision 771：
  # https://sensetime.feishu.cn/wiki/MnyvwLI9xiXd61ky83scTHsHnyc
  # acceptance 是验收设计元数据，当前 case_loader/Runner 不执行此字段。
  # W01 的串行 UI 发布与判定见 expected.publication。其他新增用例的 acceptance 仍不执行。
  - id: W01
    title: 0→1 多平台写入
    request:
      text: 写一篇《周末露营准备指南》，约1500字，包含装备清单、行程安排和安全提醒。正文需要有两张配图、一张装备表格、有序和无序列表，以及一个用 JSON 记录行程的代码块。
      attachment:
        kind: none
    expected:
      route: create
      steps:
      - prepare
      - outline
      - write_document
      artifacts:
        required:
          outline_document:
            extension: .md
          section_instructions: {}
        forbidden:
        - source_document
        - document_write_result
      final:
        extension: .md
        representation: markdown
        new_revision: true
      write_back:
        calls: 0
      content:
        min_chars: 900
        max_chars: 2800
      media:
        min_images: 2
      publication:
        mode: sequential
        providers: [feishu, notion, github, wechat, obsidian]
        # GitHub 目标按用户要求暂留空；配置提示词中的真实仓库/目录后再移除此项。
        unconfigured_providers: [github]
    acceptance:
      automation_status: sequential_ui_execution; AI_readback_and_review_pending; github target unconfigured
      providers:
      - feishu
      - notion
      - github
      - wechat
      - obsidian
      steps:
      - 检查生成稿包含文本、两张配图、装备表格、有序和无序列表、JSON 代码块。
      - 保存初始生成稿作为比较基准，在同一编辑器中依次发布到五个平台；不恢复原稿，各平台独立记录结果。
      - 独立回读目标文档，检查正文、表格、列表、代码及图片引用保留。
      - 汇总实际返回的文档链接；微信无预览链接时记录草稿 ID，Obsidian 记录本地路径。
      - 人工打开目标文档核查图文显示。
      review_mode: ai_after_execution
      required_content:
        - 正文及主要章节完整，装备清单、行程安排、安全提醒均保留。
        - 至少两张配图，图片与原稿对应；检查可访问性或实际显示，不能仅按链接数量判断。
        - 装备表格的表头、各行数据及对应关系保留。
        - 有序列表保留顺序，无序列表保留条目。
        - JSON 行程代码块保留代码内容，语法有效。
      allowed_changes:
        - 平台正常排版差异、Markdown 与原生块格式转换、图片重托管。
      forbidden_changes:
        - 未要求的正文或结构丢失、列表顺序变化、表格数据错位、代码损坏、图片缺失。
      provider_checks:
        feishu: 根据本次文档链接或 Docx ID 回读，检查原生文档内容及图文显示。
        notion: 根据本次页面链接或 ID 回读，检查原生块中的表格、列表、代码和图片，不只读取纯文本。
        github: 检查本次实际写入提交或 PR 分支的文件和图片资源，不以默认分支代替；目标未配置时记未执行。
        wechat: 用本次草稿 ID 和文章索引定位；公众号后台首页与阅读原文链接都不是草稿预览链接。
        obsidian: 核实本次实际写入的 Vault、文件路径及图片附件，不能用预览缓存代替。
      evidence_requirements:
        - 使用本次 final.md 初稿和 publications.json 回执；连续发布不恢复原稿，检查是否累积丢失内容。
        - AI 自行选择合适的 CLI、技能或浏览器独立读取目标，保存必要的回读摘录或截图、读取时间与目标版本。
        - 报告逐平台列出执行状态、文档链接或路径、目标标识、逐项验收结果和证据位置。
        - 脚本完成不等于业务通过；未回读保持待验收，读不到或无法确认时标记证据不足。
      note: write_back.calls=0 只检查生成阶段，不包含后续 UI 主动发布。

