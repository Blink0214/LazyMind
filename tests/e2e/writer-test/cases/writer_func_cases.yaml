      - 在“台风来临前的准备工作”之后新增“应急物资准备”完整章节，内容具体且符合应急物资主题；新增章节不重复。
      - “台风过后的注意事项”和“台风期间的安全措施”整章交换顺序，正文随章移动；按 ordered_headings 核对最终顺序，无章节丢失或重复。
      - 只执行请求指定的新增和章节移动；比较全部非目标正文及原有表格、列表、图片与链接，除必要编号和引用更新、等价排版外保持不变，不以少量 required_text 命中或相似度达标替代全文检查。
      measurement_notes:
