      - 以本次规则快照、输入、源文档、最终产物、session、trace、SSE 和 UI 录屏/页面为证据；报告逐项记录观察、证据路径和 PASS / FAIL / INCONCLUSIVE，缺少证据不得推断通过。
      - 完整扩写源大纲各节要点，保留原意与主题，不只是重复标题或罗列提纲；允许自然扩写，不得丢失主要内容。
      - 正文中的交叉引用指向文档内真实存在且语义正确的目标；检查源位置、目标章节及实际跳转/锚点关系，不以纯文本提及或链接数量代替有效引用。
      - 按 expected.numbering、ref_integrity 和 ref_number_consistency 实际配置检查导出/最终展示：章节编号层级与顺序正确，存在的图表或代码题注编号连贯，锚点唯一且无悬空引用；正文显示的引用编号与当前目标对应。不要要求编号必须写入原始
        IR content。
      - 至少一处有效的章节内部交叉引用，且在飞书最终文档中对应正确目标。
      - 本次请求无需配图：最终稿不新增配图；不得将配图缺失判为失败。配置 image_calls=0 时另核对本次图片生成调用确为零。
      - 按本次飞书目标链接独立读取原生内容，核对正文、结构及专项要求；按 expected 核对写回次数、方式和前后版本。保存链接、读取时间、版本与证据。格式转换可改变排版，不得丢失或错置内容，版本增加本身不代表写入正确。
      measurement_notes:
        character_count: 沿用原内容校验口径：Markdown 去行首标题标记、列表前缀、HTML a 标签及 ` * _ > [ ] ( ) 标记；IR 取标题和递归块 content；随后去全部空白，按字符数比较
          min_chars/max_chars（含边界）。这是测试统计口径，不是中文词数；不得直接使用 raw_markdown characters 替代。
        heading_coverage: 沿用原覆盖率口径：提取源文档和成稿标题，去开头数字章节号及全部空白；逐个源标题检查是否出现在成稿标题拼接文本中，命中数/源标题数与 source_heading_coverage_min
          比较。标题改写导致未命中须如实报告，另核对语义内容；源标题或源文档缺失时不能推断通过。


