  # 写作 3.0（9月）新增用例，来源文档 revision 771：
  # https://sensetime.feishu.cn/wiki/MnyvwLI9xiXd61ky83scTHsHnyc
  # acceptance 是验收设计元数据，当前 case_loader/Runner 不执行此字段。
  # 新增用例的发布、复制、非飞书基线与独立回读尚未接入；机械通过不代表完整验收通过。
  - id: W01
    title: 0→1 多平台写入
    request:
      text: 写一篇《周末露营准备指南》，约1500字，包含装备清单、行程安排和安全提醒。正文需要有两张配图、一张装备表格、有序和无序列表，以及一个用 JSON 记录行程的代码块。
      attachment:
        kind: none
    expected:
      route: create
      steps:
      - prepare
      - outline
      - write_document
      artifacts:
        required:
          outline_document:
            extension: .md
          section_instructions: {}
        forbidden:
        - source_document
        - document_write_result
      final:
        extension: .md
        representation: markdown
        new_revision: true
      write_back:
        calls: 0
      content:
        min_chars: 900
        max_chars: 2800
      media:
        min_images: 2
    acceptance:
      automation_status: generation_only; publication/readback pending
      providers:
      - feishu
      - notion
      - github
      - wechat
      - obsidian
      steps:
      - 检查生成稿包含文本、两张配图、装备表格、有序和无序列表、JSON 代码块。
      - 固定同一份生成稿，通过 UI 分别发布到五个平台；各平台独立记录结果。
      - 独立回读目标文档，检查正文、表格、列表、代码及图片引用保留。
      - 汇总实际返回的文档链接；微信无预览链接时记录草稿 ID，Obsidian 记录本地路径。
      - 人工打开目标文档核查图文显示。
      note: write_back.calls=0 只检查生成阶段，不包含后续 UI 主动发布。

  - id: E02
    title: Markdown / LaTeX 复制
    request:
      text: 写一篇《机器学习中的常见损失函数》，介绍均方误差、交叉熵和 Huber 损失，包含相关公式和推导、一张对比表格、使用建议列表及 Python 示例代码，约1500字，无需配图。
      attachment:
        kind: none
    expected:
      route: create
      steps:
      - prepare
      - outline
      - write_document
      artifacts:
        required:
          outline_document:
            extension: .md
          section_instructions: {}
        forbidden:
        - source_document
        - document_write_result
      final:
        extension: .md
        representation: markdown
        new_revision: true
      write_back:
        calls: 0
      content:
        min_chars: 900
        max_chars: 2800
      image_calls: 0
    acceptance:
      automation_status: generation_only; render/clipboard pending
      steps:
      - 检查 LazyMind 中公式与推导、对比表格、建议列表、Python 代码块正常渲染。
      - 对同一份稿件分别点击复制 Markdown 和 LaTeX，保存实际剪贴板内容。
      - 检查复制内容保留公式、表格、列表及代码块。
      - 人工粘贴到语雀与 Overleaf，分别核查显示与 LaTeX 编译结果。

  - id: R01
    provider_doc: notion_file
    title: Revise Notion
    constraints: revise
    request:
      text: 修改这份Notion文档，将“安全与环保”整节移到“装备准备”之前，其他内容不变：${notion_file}
      attachment:
        kind: none
    expected:
      route: revise
      steps:
      - prepare
      - write_document
      artifacts:
        required:
          source_document:
            provider: notion
          document_revision_task:
            task_type: revise
          document_modify_plan: {}
          document_revision_result:
            success: true
        forbidden:
        - outline_document
        - section_instructions
      final:
        provider: notion
        new_revision: true
      write_back:
        calls: 1
    acceptance:
      automation_status: provider baseline/readback and business checks pending
      provider: notion
      preconditions:
      - 运行前保存并确认原始基线；重复执行前恢复基线或使用经确认的测试副本。
      steps:
      - 安全与环保章节整体位于装备准备之前，无重复或丢失。
      - 确认目标文档实际写回成功，独立回读并与修订前基线比对。
      - 未要求修改的正文、结构和图片保持不变；保存目标链接或路径供人工核查。
      source_registry_key: notion_file

  - id: R02
    provider_doc: wechat_title
    title: Revise Wechat
    constraints: revise
    request:
      text: 修改微信公众号草稿箱中的《${wechat_title}》，将“安全与环保”章节改得具体些，让第一次露营的人知道该注意什么。
