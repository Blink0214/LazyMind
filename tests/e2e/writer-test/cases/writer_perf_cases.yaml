scenarios:
- id: P01
  title: 0-1 写作
  cases:
  - id: 1
    text: '请启动 AI Writer，帮我写一篇时间自动机主动学习优化的论文，需要包含时间自动机与主动学习的基本概念，现有的算法局限、可优化方向、实验步骤和评价指标等内容。
          全文控制在 3000 字以内，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。'
    constraints: write
  - id: 2
    text: '请启动 AI Writer，请帮我撰写一份2025年大模型产业落地调研报告，包含行业概览、技术趋势、典型应用场景、市场规模与竞争格局、挑战与风险以及发展建议等章节。
          全文控制在 3000 字以内，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。'
    constraints: write
  - id: 3
    text: '请启动 AI Writer，帮我写一篇科幻小说，讲述人类在一颗资源枯竭的流浪行星上发现远古文明遗迹、最终跨越种族隔阂重建家园的故事，包含序章、若干章节正文和尾声。
          全文控制在 3000 字以内，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。'
    constraints: write
  - id: 4
    text: '请启动 AI Writer，请帮我撰写一篇面向开发者的技术博客，系统讲解检索增强生成（RAG）的原理、架构设计与工程实践，包含背景动机、核心原理、系统架构、实现步骤、常见问题与优化技巧、总结等章节。
          全文控制在 3000 字以内，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。'
    constraints: write
  - id: 5
    text: '请启动 AI Writer，请帮我编写一份智能家居中控屏的用户使用手册，涵盖产品简介、开箱清单、安装连接、功能操作、场景联动、故障排除与售后保修等章节。
          全文控制在 3000 字以内，正文最多 6 个一级章节，不要添加附录。本文无需配图，不要搜索、生成或插入任何图片。'
    constraints: write
