- id: P04
  title: 基于 Markdown 的全文修改
  cases:
  - id: 1
    text: '请启动 AI Writer，请针对附件上传的文章按照下述要求直接修改，并以 Markdown 形式输出修改后的完整文档。
          在"4.3 结果分析"小节中，将目前先讲多时钟实例、再讲单时钟实例的段落顺序对调，改为先陈述单时钟实例上三种方法差距较小的结论，再展开多时钟实例上的对比分析，使叙述从简单到复杂、逻辑更顺畅。'
    constraints: revise
    attachment: fixtures/perf/p04_case1.md
  - id: 2
    text: '请启动 AI Writer，请针对附件上传的文章按照下述要求直接修改，并以 Markdown 形式输出修改后的完整文档。
          在"三、典型应用场景"的"1. 垂直领域落地案例"部分，于"1.3 教育"之后新增一个小节"1.4 制造业"，介绍大模型在预测性维护、产线质检、供应链优化与工业知识管理等场景的落地情况，要求包含1-2个虚构的合理数据点，篇幅与前三个小节相当。'
    constraints: revise
    attachment: fixtures/perf/p04_case2.txt
  - id: 3
    text: '请启动 AI Writer，请针对附件上传的文章按照下述要求直接修改，并以Markdown的形式输出修改后的完整文档。
          1. 在“第三章 隔阂与冲突”中，把议事会争论段落移动到石磊夜袭七号矿井并触发防御机制受挫之后，并补充必要过渡句。
          2. 在“第四章 共生之路”中，把林远提出的折中方案拆成两个段落：第一段写技术共享与遗迹地位，第二段写监督委员会及权限约束。'
    constraints: revise
    attachment: fixtures/perf/p04_case3.md
  - id: 4
    text: '请启动 AI Writer，请针对附件上传的文章按照下述要求直接修改，并以Markdown的形式输出修改后的完整文档。
          1. 将“RAG 与微调：知识注入的路线对比”整节改写成 Markdown 表格，使用“对比维度 / RAG / 微调”三列，包含更新成本、知识规模、可追溯性、适用任务、实现成本与周期、维护难度六行。在表格后保留一段总结，并将原“实践经验”引用块整合进总结，不再保留引用块。
          2. 合并梳理“分块策略不当导致检索质量差”和“上下文过长导致生成质量下降”中关于块大小及上下文长度的重复对策；然后在前一小节末尾补充约 120 字的过渡说明，阐明分块大小与最终上下文长度是输入端和消费端的同一对矛盾，并自然引出下一节。'
    constraints: revise
    attachment: fixtures/perf/p04_case4.txt
  - id: 5
    text: '请启动 AI Writer，请针对附件上传的文章按照下述要求直接修改，并以Markdown的形式输出修改后的完整文档。
          1. 将壁挂安装第 3 步扩展成两到三步，补充 6mm 钻头、约 35mm 打孔深度，以及打孔前确认墙内无水管和电线的安全提示。
          2. 把“产品定位与核心功能”中的五项功能拆出，与“适用场景与兼容设备”合并为“2. 核心功能与适用场景”；先写功能，再写适用场景与兼容设备，后续编号相应调整。'
    constraints: revise
    attachment: fixtures/perf/p04_case5.md
