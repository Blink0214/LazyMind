id: paper-writing
name: 论文写作
description: 支持选题、综述、实验、分析、写作、审稿与阅读心得；数据分析与模拟审稿已接真实算法，其他能力仍在开发。
when_to_use: >
  用户只要求数据分析时，直接选择 data_analysis；F4 工具会从当前会话的 JSON 附件读取完整约定输入，
  不需要模型逐行读取或重写附件内容。已有 paper_input 或材料池绑定时优先沿用绑定。
  Use when the user requests the paper-writing workflow or review of an uploaded academic manuscript.
  Bind the exact attachment filename to manuscript_file and select peer_review directly;
  do not first summarize or copy the manuscript through Chat.
  Bind pasted manuscript text to manuscript_text; paper_topic and review_request are optional.
  Do not ask users for JSON or a material pool; paper_input is only for existing programmatic integrations.
  Ask which manuscript to review only when multiple attachments make the target ambiguous.
  Never substitute a filename or summary for the manuscript.
  After the requested steps succeed and their artifacts are published, acknowledge completion in one
  short sentence in the user's language and direct them to the workflow.
  Do not repeat the document, review, or JSON, or list issues, conclusions, or next-step options.
  Do not call list_artifacts, read_artifact, read_file_resource, or similar tools merely to summarize,
  repeat, or reconfirm successfully published artifacts.
  Read results when explicitly asked to explain them; continue subsequent steps when explicitly requested,
  then acknowledge briefly once the current request is fulfilled.
  For a review-only request, stop after successful review without automatically revising or finishing the workflow.
  On failure or missing required input, explain the actual cause and wait for user action; do not claim success.
  Always relay necessary user_notice messages from tools.
runtime:
  trigger_inputs: [manuscript_file, manuscript_text, paper_topic, review_request, paper_input]
  transactional_outputs: true
  recovery_inputs:
    literature_review:
      recovery_research_pool: refine_topic_pool
      recovery_research_document: refine_topic_document
    peer_review:
      recovery_review_pool: revise_document_pool
      recovery_review_document: revise_document_document
tool_scripts:
  - path: scripts/tools.py
    functions: [run_paper_step]
steps:
  - {id: research_topic, label: "研究选题"}
  - {id: literature_review, label: "文献综述"}
  - {id: refine_topic, label: "调整选题"}
  - {id: experiment, label: "实验研究"}
  - {id: data_analysis, label: "数据分析"}
  - {id: write_document, label: "论文写作"}
  - {id: peer_review, label: "模拟审稿"}
  - {id: revise_document, label: "论文修订"}
  - {id: reading_reflection, label: "阅读心得"}
  - {id: finish, label: "结束"}
slots:
  - {id: manuscript_file, label: 待审论文, type: file, cardinality: single, external: true, exposed: false}
  - {id: manuscript_text, label: 论文正文, type: text, cardinality: single, external: true, exposed: false}
  - {id: paper_topic, label: 论文主题, type: text, cardinality: single, external: true, exposed: false}
  - {id: review_request, label: 审稿要求, type: text, cardinality: single, external: true, exposed: false}
  - {id: paper_input, type: json, cardinality: single, external: true, exposed: false}
  - {id: recovery_research_pool, type: file, cardinality: single, external: true, exposed: false}
  - {id: recovery_research_document, type: file, cardinality: single, external: true, exposed: false}
  - {id: recovery_review_pool, type: file, cardinality: single, external: true, exposed: false}
  - {id: recovery_review_document, type: file, cardinality: single, external: true, exposed: false}
  - {id: seed_pool, label: 输入材料池, type: file, cardinality: single, external: true, exposed: false}
  - {id: research_topic_pool, label: "研究选题材料池", type: file, cardinality: single, exposed: false}
  - {id: research_topic_document, label: "研究选题", type: file, cardinality: single}
  - {id: literature_review_pool, label: "文献综述材料池", type: file, cardinality: single, exposed: false}
  - {id: literature_review_document, label: "文献综述", type: file, cardinality: single}
  - {id: refine_topic_pool, label: "调整选题材料池", type: file, cardinality: single, exposed: false}
  - {id: refine_topic_document, label: "调整选题", type: file, cardinality: single}
  - {id: experiment_pool, label: "实验研究材料池", type: file, cardinality: single, exposed: false}
  - {id: experiment_document, label: "实验研究", type: file, cardinality: single}
  - {id: data_analysis_pool, label: "数据分析材料池", type: file, cardinality: single, exposed: false}
  - {id: data_analysis_document, label: "数据分析", type: file, cardinality: single}
  - {id: write_document_pool, label: "论文写作材料池", type: file, cardinality: single, exposed: false}
  - {id: write_document_document, label: "论文写作", type: file, cardinality: single}
  - {id: peer_review_pool, label: "模拟审稿材料池", type: file, cardinality: single, exposed: false}
  - {id: peer_review_document, label: "模拟审稿", type: file, cardinality: single}
  - {id: peer_review_data, label: "结构化审稿意见", type: file, cardinality: single, exposed: false}
  - {id: revise_document_pool, label: "论文修订材料池", type: file, cardinality: single, exposed: false}
  - {id: revise_document_document, label: "论文修订", type: file, cardinality: single}
  - {id: reading_reflection_pool, label: "阅读心得材料池", type: file, cardinality: single, exposed: false}
  - {id: reading_reflection_document, label: "阅读心得", type: file, cardinality: single}
  - {id: analysis_chart, label: 分析图表, type: file, cardinality: list, ordered: true}
  - {id: finish_document, label: 结束说明, type: file, cardinality: single, exposed: false}
ui:
  hide_skipped_steps: true
  hide_unstarted_steps: true
  task_presentation:
    hidden_steps: [finish]
  slots:
    seed_pool: {widgetType: json-block, readOnly: false, collapsed: false}
    research_topic_document: {widgetType: text-markdown, readOnly: false}
    literature_review_document: {widgetType: text-markdown, readOnly: false}
    refine_topic_document: {widgetType: text-markdown, readOnly: false}
    experiment_document: {widgetType: text-markdown, readOnly: false}
    data_analysis_document: {widgetType: text-markdown, readOnly: false}
    write_document_document: {widgetType: text-markdown, readOnly: false}
    peer_review_document: {widgetType: text-markdown, readOnly: false}
    revise_document_document: {widgetType: text-markdown, readOnly: false}
    reading_reflection_document: {widgetType: text-markdown, readOnly: false}
    finish_document: {widgetType: text-markdown, readOnly: true}
  tabs:
    - id: research_topic
      step_id: research_topic
      label: "研究选题"
      layout: list
      allow_download: true
      slots:
        - {id: research_topic_document}
    - id: literature_review
      step_id: literature_review
      label: "文献综述"
      layout: list
      allow_download: true
      slots:
        - {id: literature_review_document}
    - id: refine_topic
      hide_when_step_skipped: literature_review
      step_id: refine_topic
      label: "调整选题"
      layout: list
      allow_download: true
      slots:
        - {id: refine_topic_document}
    - id: experiment
      step_id: experiment
      label: "实验研究"
      layout: list
      allow_download: true
      slots:
        - {id: experiment_document}
    - id: data_analysis
      step_id: data_analysis
      label: "数据分析"
      layout: list
      allow_download: true
      slots:
        - {id: data_analysis_document}
        - {id: analysis_chart}
    - id: write_document
      step_id: write_document
      label: "论文写作"
      layout: list
      allow_download: true
      slots:
        - {id: write_document_document}
    - id: peer_review
      step_id: peer_review
      label: "模拟审稿"
      layout: list
      allow_download: true
      slots:
        - {id: peer_review_document}
    - id: revise_document
      step_id: revise_document
      label: "论文修订"
      layout: list
      allow_download: true
      slots:
        - {id: revise_document_document}
    - id: reading_reflection
      step_id: reading_reflection
      label: "阅读心得"
      layout: list
      allow_download: true
      slots:
        - {id: reading_reflection_document}
