initial: __start__
start_route: all
transitions:
  __start__:
  - to: explore_directions
  explore_directions:
  - to: prepare_seed_set
  prepare_seed_set:
  - to: expand_and_screen
  expand_and_screen:
  - to: analyze_relations
  analyze_relations:
  - to: compose_result
  compose_result:
  - to: __end__
steps:
  explore_directions:
    label: 调研与方向
    prompt: '{{runtime_instruction}}

      调研完成后调用 academic_submit_directions(expansion_id, directions)，每项包含 name、rationale、differences、representative_paper_ids、selected。代表论文 ID 来自本次搜索或种子。工具保留完整用户要求并保存 direction_research；无需调用 save_artifacts 或抄写元数据，成功后结束，参数错误时按提示修正。

      先调用 academic_expansion_context 读取启动消息中的拓展记录 ID，保留完整原始指令和历史。调用 academic_search_papers(expansion_id, query) 从 arXiv 实际搜索，保留来源、版本及查询结果；不从知识库搜索候选。围绕用户要求归纳候选研究方向，每项包含依据、差异、代表论文。范围已明确时至少一项 selected=true；多个合理范围尚待选择时全部 selected=false，由主
      Chat 在步骤完成后 ask_user，子步骤不得伪造用户选择或调用 ask_user。不要重复追问已知边界。'
    tools:
    - academic_expansion_context
    - academic_search_papers
    - academic_read_paper
    - academic_submit_directions
    terminal_tools: [academic_submit_directions]
    inputs:
    - material: expansion_id
      required: true
    outputs:
    - material: direction_research
      required: true
    acceptance_criteria: 严格遵循用户的纳入、排除和新增限制；保留真实论文身份和完整用户要求；外部搜索和实际全文读取状态如实展示，不编造候选或全文证据。
  prepare_seed_set:
    label: 准备种子论文
    prompt: '{{runtime_instruction}}

      调用 academic_submit_papers(expansion_id, paper_ids, selected_directions) 保存 seed_set；已调研的用户自定义方向通过 additional_directions 补充。工具保留全部种子和完整用户要求，按真实 ID 补齐论文元数据、版本及标记；无需调用 save_artifacts 或抄写元数据，成功后结束，参数错误时按提示修正。

      先调用 academic_expansion_context 读取当前记录的 interactions 与 user_updates，使用 answered=true 的实际 answers 中 value 数组作为用户方向选择；不能仅依据旧 result 的默认方向或自行揣测。结合方向调研和自定义方向。自定义方向先补充有依据的调研；selected_directions 必须是 candidate_directions
      中的原字符串且至少一项。所有用户选择种子保留；方向入口从外部搜索发现代表论文，is_seed=false；只有启动时用户选定的论文才是种子。仅选择用户要求的方向范围内的论文，复用已有搜索结果。paper_id 只能来自服务返回的真实身份。原始要求、追问回答、后续补充由工具完整并入 user_instruction。'
    tools:
    - academic_expansion_context
    - academic_search_papers
    - academic_read_paper
    - academic_submit_papers
    terminal_tools: [academic_submit_papers]
    inputs:
    - material: expansion_id
      required: true
    - material: direction_research
      required: true
    outputs:
    - material: seed_set
      required: true
    acceptance_criteria: 严格遵循用户的纳入、排除和新增限制；保留真实论文身份和完整用户要求；外部搜索和实际全文读取状态如实展示，不编造候选或全文证据。
  expand_and_screen:
    label: 拓展与筛选
    prompt: '{{runtime_instruction}}

      调用 academic_submit_papers(expansion_id, paper_ids, selected_directions)，提交最终保留的论文 ID 和 seed_set.selected_directions。工具保留全部种子、完整用户要求和原始元数据，保存 expanded_papers；无需调用 save_artifacts 或抄写元数据，成功后结束，参数错误时按提示修正。

      读取 seed_set.user_instruction 并严格执行用户的纳入、排除和新增限制。若用户要求只保留种子、不新增，则 papers 必须只保留原种子；读取种子和已选方向，调用 academic_search_papers(expansion_id, query) 实际搜索外部候选，无结果时如实保存，不用本地论文或模型记忆补齐。保留全部种子，去重并筛选最终保留论文；被淘汰的候选不得进入最终集合。保留每篇真实
      paper_id，不编造 ID、元数据或下载链接。没有新增论文时仍保存正常完成结果，综述是否可启动由服务端按至少两篇全文成功判断。'
    tools:
    - academic_expansion_context
    - academic_search_papers
    - academic_read_paper
    - academic_submit_papers
    terminal_tools: [academic_submit_papers]
    inputs:
    - material: expansion_id
      required: true
    - material: seed_set
      required: true
    outputs:
    - material: expanded_papers
      required: true
    acceptance_criteria: 严格遵循用户的纳入、排除和新增限制；保留真实论文身份和完整用户要求；外部搜索和实际全文读取状态如实展示，不编造候选或全文证据。
  analyze_relations:
    label: 研究关系分析
    prompt: '{{runtime_instruction}}

      读取绑定的 expanded_papers，逐篇调用 academic_read_paper(expansion_id, paper_id)，通过 next_cursor 读取至游标为空，才算读完全文。游标续读属于同一篇正文读取，不计入外部搜索轮次。processing、failed、unavailable 时保留论文，只分析已实际读取的材料，不能把摘要称为全文。

      分析完成后调用 academic_submit_relations(analyses)。analyses 是对象数组，必须准确覆盖 expanded_papers 的每个 paper_id；每项只含 paper_id 及可选的纯文本 seed_relation、direction_relation、key_contribution。每篇用完整段落表达分析，不创建嵌套证据对象，不抄写标题、作者、摘要、版本、下载链接、状态或搜索日志。仅有摘要时说明依据摘要，无法分析时省略对应描述。真实无结果时提交空数组。

      发布工具会核对来源并补齐已有信息。返回成功即结束；不调用 save_artifacts、patch_artifact，不保存测试对象或空壳。校验失败时只修正工具指出的字段后重新提交。'
    tools:
    - academic_expansion_context
    - academic_read_paper
    - academic_submit_relations
    terminal_tools: [academic_submit_relations]
    inputs:
    - material: expansion_id
      required: true
    - material: expanded_papers
      required: true
    outputs:
    - material: paper_relations
      required: true
    acceptance_criteria: 严格遵循用户的纳入、排除和新增限制；保留真实论文身份和完整用户要求；外部搜索和实际全文读取状态如实展示，不编造候选或全文证据。
  compose_result:
    label: 整理拓展成果
    prompt: '{{runtime_instruction}}

      直接调用无参数的 academic_publish_expansion_result。工具读取本步骤绑定且已校验的 paper_relations，自动生成并保存 expansion_result，其顶层只有 user_instruction、candidate_directions、selected_directions、papers。无需重新检索、阅读、分析或生成 JSON。

      返回成功后结束。服务沿用现有成果投影、轮次和下游 Mock 交接规则；当前 Chat 不执行综述。'
    tools: [academic_publish_expansion_result]
    tools_only: true
    terminal_tools: [academic_publish_expansion_result]
    inputs:
    - material: expansion_id
      required: true
    - material: paper_relations
      required: true
    outputs:
    - material: expansion_result
      required: true
    acceptance_criteria: 严格遵循用户的纳入、排除和新增限制；保留真实论文身份和完整用户要求；外部搜索和实际全文读取状态如实展示，不编造候选或全文证据。
